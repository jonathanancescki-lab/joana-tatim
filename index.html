/* ==========================================================================
   TOKENS · Joana Tatim
   Ideia de layout: um ciclorama branco de estúdio. O trabalho ocupa o quadro
   e o texto fica nas margens, como anotações de claquete.
   Tema único por escolha (o mundo visual da Joana é o fundo claro de estúdio).
   ========================================================================== */

:root {
  color-scheme: light;

  /* -- Cor ---------------------------------------------------------------- */
  --color-paper: #f2f2ef;      /* fundo: papel de estúdio, neutro levemente frio */
  --color-surface: #e6e6e1;    /* fundo de quadro antes do pôster carregar */
  --color-ink: #121211;        /* texto principal */
  --color-ink-soft: #57574f;   /* metadados (contraste 6.4:1 sobre o papel) */
  --color-line: #cbcbc4;       /* fios e bordas */
  --color-rec: #d22f19;        /* luz de REC: som ligado, estados ativos */

  /* Marcação de placeholder (dado ainda não fornecido) */
  --color-ph-bg: #f5e6a3;
  --color-ph-ink: #4a3b00;

  /* -- Tipografia --------------------------------------------------------- */
  --font-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  /* Escala modular (~1.25), fluida nos degraus de display */
  --step--1: 0.78rem;
  --step-0: 1rem;
  --step-1: 1.2rem;
  --step-2: clamp(1.35rem, 1.1rem + 0.9vw, 1.8rem);
  --step-3: clamp(1.9rem, 1.3rem + 2.2vw, 3.1rem);
  --step-4: clamp(2.4rem, 1.5rem + 3.6vw, 4.6rem);
  --step-5: clamp(3.2rem, 1.6rem + 6.4vw, 7.4rem);

  --leading-tight: 1.05;
  --leading-snug: 1.25;
  --leading-body: 1.55;
  --measure: 62ch;

  /* -- Espaço ------------------------------------------------------------- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 40px;
  --space-7: 64px;
  --space-8: 112px;
  --gutter: clamp(16px, 3.2vw, 44px);
  --max: 1600px;
  --header-h: 60px;

  /* -- Forma e movimento -------------------------------------------------- */
  --radius-s: 2px;
  --radius-pill: 999px;
  --frame-ratio: 3 / 4;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-1: 160ms;
  --dur-2: 420ms;
  --dur-3: 900ms;

  /* -- Camadas ------------------------------------------------------------ */
  --z-header: 20;
  --z-draft: 30;
}
</style>
  <style>/* assets/css/base.css */
/* ==========================================================================
   BASE · reset, tipografia, utilitários e botões
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html {
  background: var(--color-paper);
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--header-h) + var(--space-4));
}

body {
  margin: 0;
  background: var(--color-paper);
  color: var(--color-ink);
  font: 400 var(--step-0) / var(--leading-body) var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img, video { display: block; max-width: 100%; }
h1, h2, h3, h4 { margin: 0; font-weight: 400; text-wrap: balance; }
p, figure, blockquote, dl, dd { margin: 0; }
ul, ol { margin: 0; padding: 0; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.22em; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

:focus-visible {
  outline: 2px solid var(--color-ink);
  outline-offset: 3px;
}

/* -- Utilitários -------------------------------------------------------- */
.wrap {
  width: 100%;
  max-width: var(--max);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.mono {
  font-family: var(--font-mono);
  font-size: var(--step--1);
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}

.soft { color: var(--color-ink-soft); }

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute;
  left: var(--gutter);
  top: -100px;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-ink);
  color: var(--color-paper);
}
.skip-link:focus { top: var(--space-3); }

/* Placeholder de conteúdo: dado que a Joana ainda precisa fornecer */
.ph {
  font-family: var(--font-mono);
  font-size: 0.82em;
  line-height: 1.4;
  padding: 0.05em 0.4em;
  background: var(--color-ph-bg);
  color: var(--color-ph-ink);
  border: 1px dashed currentColor;
  border-radius: var(--radius-s);
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
html.show-placeholders .ph { outline: 2px solid var(--color-rec); outline-offset: 2px; }

/* Cabeçalho de seção: rótulo em mono + título */
.section-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 3fr);
  gap: var(--space-4) var(--gutter);
  align-items: baseline;
  padding-block: var(--space-7) var(--space-6);
}
.section-head__label { color: var(--color-ink-soft); }
.section-head__title {
  font-family: var(--font-display);
  font-size: var(--step-3);
  line-height: var(--leading-tight);
  letter-spacing: -0.02em;
}
@media (max-width: 760px) {
  .section-head { grid-template-columns: 1fr; padding-block: var(--space-6) var(--space-5); }
}

/* -- Botões ------------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.6em;
  min-height: 44px;
  padding: 0.7em 1.15em;
  border: 1px solid var(--color-ink);
  border-radius: var(--radius-pill);
  background: var(--color-ink);
  color: var(--color-paper);
  font-family: var(--font-mono);
  font-size: var(--step--1);
  letter-spacing: 0.03em;
  text-decoration: none;
  cursor: pointer;
  transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.btn:hover { background: transparent; color: var(--color-ink); }
.btn--ghost { background: transparent; color: var(--color-ink); }
.btn--ghost:hover { background: var(--color-ink); color: var(--color-paper); }
.btn svg { width: 14px; height: 14px; flex: none; }

.link-arrow {
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  padding: 0;
  border: 0;
  background: none;
  font-family: var(--font-mono);
  font-size: var(--step--1);
  text-decoration: underline;
  text-underline-offset: 0.3em;
  cursor: pointer;
}
.link-arrow svg { width: 14px; height: 14px; transition: translate var(--dur-1) var(--ease); }
.link-arrow:hover svg { translate: 3px 0; }

/* Botão redondo sobre mídia */
.icon-btn {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgb(18 18 17 / 0.55);
  color: #fff;
  cursor: pointer;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  transition: background var(--dur-1) var(--ease);
}
.icon-btn:hover { background: rgb(18 18 17 / 0.8); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn[data-role="sound"][aria-pressed="true"] { background: var(--color-rec); }
.icon-btn:focus-visible { outline-color: #fff; box-shadow: 0 0 0 4px var(--color-ink); }

/* -- Movimento reduzido ------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
  <style>/* assets/css/components/header.css */
/* HEADER · marca, navegação e controles globais de som e movimento */

.site-header {
  position: sticky;
  top: 0;
  z-index: var(--z-header);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  grid-template-areas: "brand nav tools";
  align-items: center;
  gap: var(--space-3) var(--space-5);
  min-height: var(--header-h);
  padding: var(--space-2) var(--gutter);
  background: color-mix(in srgb, var(--color-paper) 86%, transparent);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid color-mix(in srgb, var(--color-line) 60%, transparent);
}

.wordmark {
  grid-area: brand;
  justify-self: start;
  font-family: var(--font-display);
  font-size: 1.45rem;
  line-height: 1;
  letter-spacing: -0.02em;
  text-decoration: none;
}

.site-nav { grid-area: nav; }
.site-nav ul { display: flex; gap: clamp(14px, 2.4vw, 36px); list-style: none; }
.site-nav a {
  font-family: var(--font-mono);
  font-size: var(--step--1);
  text-decoration: none;
  padding-block: var(--space-2);
}
.site-nav a:hover,
.site-nav a[aria-current="page"] { text-decoration: underline; }

.header-tools {
  grid-area: tools;
  justify-self: end;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  min-height: 36px;
  padding: 0.35em 0.75em;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-pill);
  background: transparent;
  font-family: var(--font-mono);
  font-size: var(--step--1);
  cursor: pointer;
  white-space: nowrap;
}
.toggle:hover { border-color: var(--color-ink); }
.toggle__dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--color-ink-soft);
  transition: background var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
}
.toggle[aria-pressed="true"] .toggle__dot {
  background: var(--color-rec);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-rec) 22%, transparent);
}
.toggle__state { color: var(--color-ink-soft); }

.header-cta { min-height: 36px; padding-block: 0.4em; }

@media (max-width: 900px) {
  .site-header {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "brand tools" "nav nav";
  }
  .header-cta { display: none; }
}
@media (max-width: 420px) {
  .toggle__state { display: none; }
  .toggle { padding-inline: 0.6em; }
}
</style>

  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);

.hero__text { display: grid; gap: var(--space-5); padding-bottom: var(--space-4); }
.hero__eyebrow { color: var(--color-ink-soft); }

  font-size: var(--step-5);

  <style>/* assets/css/components/media-frame.css */
/* MEDIA FRAME · quadro de vídeo com pôster, autoplay silencioso e controles */

.media-frame {
  position: relative;
  aspect-ratio: var(--ratio, var(--frame-ratio));
  overflow: hidden;
  isolation: isolate;
  background: var(--tint, var(--color-surface));
}

.media-frame__poster,
.media-frame__video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.media-frame__poster { transition: scale var(--dur-3) var(--ease); }

.media-frame__video {
  opacity: 0;
  transition: opacity var(--dur-2) var(--ease);
}
.media-frame[data-state="playing"] .media-frame__video,
.media-frame[data-state="paused"] .media-frame__video { opacity: 1; }

.media-frame__controls {
  position: absolute;
  right: var(--space-3);
  bottom: var(--space-3);
  z-index: 2;
  display: flex;
  gap: var(--space-2);
}
.media-frame:not([data-has-video]) .media-frame__controls { display: none; }

/* Selo "prévia": só aparece com o destaque de placeholders ligado */
.media-frame__tag {
  position: absolute;
  left: var(--space-3);
  top: var(--space-3);
  z-index: 2;
  display: none;
  padding: 0.2em 0.5em;
  background: var(--color-ph-bg);
  color: var(--color-ph-ink);
  border: 1px dashed currentColor;
  font-family: var(--font-mono);
  font-size: 0.7rem;
}
html.show-placeholders [data-placeholder-media] { outline: 2px dashed var(--color-rec); outline-offset: -2px; }
html.show-placeholders [data-placeholder-media] .media-frame__tag { display: block; }

.media-frame[data-state="unavailable"] .media-frame__controls { display: none; }
</style>

/* FEATURED · sequência de projetos em quase tela cheia, sobre a cor do próprio vídeo */

.features { display: grid; }

.feature {
  --field: color-mix(in oklab, var(--tint) 40%, var(--color-paper));
  --color-ink-soft: #34342f; /* garante contraste sobre o campo tingido */
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  align-items: center;
  gap: var(--space-6) var(--gutter);
  min-height: calc(100svh - var(--header-h));
  padding: clamp(32px, 4vw, 56px) var(--gutter);
  background: var(--field);
}

.feature__frame {
  justify-self: center;
  width: min(100%, 720px, calc((100svh - var(--header-h) - 112px) * 0.75));
}
.feature:nth-child(even) .feature__frame { order: 2; }

.feature__note {
  display: grid;
  gap: var(--space-4);
  max-width: 40ch;
  justify-self: center;
}
.feature__index { display: flex; gap: var(--space-4); color: var(--color-ink-soft); }
.feature__title {
  font-family: var(--font-display);
  font-size: var(--step-3);
  line-height: var(--leading-tight);
  letter-spacing: -0.02em;
}
.feature__brand { font-family: var(--font-mono); font-size: var(--step--1); }
.feature__caption { font-size: var(--step-1); line-height: var(--leading-snug); }
.feature__caption p + p { margin-top: 0.5em; }

@media (prefers-reduced-motion: no-preference) {
  @supports (animation-timeline: view()) {
    .feature__frame {
      animation: frame-settle linear both;
      animation-timeline: view();
      animation-range: entry 0% cover 45%;
    }
    @keyframes frame-settle {
      from { scale: 0.92; }
      to { scale: 1; }
    }
  }
}

@media (max-width: 820px) {
  .feature { grid-template-columns: 1fr; min-height: 0; }
  .feature:nth-child(even) .feature__frame { order: 0; }
  .feature__frame { width: min(100%, calc(78svh * 0.75)); }
  .feature__note { justify-self: start; }
}
</style>
  <style>/* assets/css/components/work-index.css */
/* WORK INDEX · filtros por categoria e formato + grade com ritmo variado */

.work-index { padding-bottom: var(--space-8); }

.filters {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--space-4) var(--space-6);
  padding-bottom: var(--space-5);
  margin-bottom: var(--space-5);
  border-bottom: 1px solid var(--color-line);
}
.filters fieldset { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: 0; padding: 0; border: 0; }
.filters legend {
  float: left;
  width: 100%;
  margin-bottom: var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--step--1);
  color: var(--color-ink-soft);
}

.chip { position: relative; display: inline-flex; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip > span {
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  min-height: 40px;
  padding: 0.45em 0.95em;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-pill);
  font-size: 0.92rem;
  cursor: pointer;
  transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}
.chip > span:hover { border-color: var(--color-ink); }
.chip input:checked + span { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-paper); }
.chip input:focus-visible + span { outline: 2px solid var(--color-ink); outline-offset: 3px; }
.chip input:disabled + span { opacity: 0.4; cursor: not-allowed; }
.chip__count { font-family: var(--font-mono); font-size: 0.72rem; opacity: 0.7; }

.filters__status { margin-left: auto; color: var(--color-ink-soft); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr));
  grid-auto-flow: dense;
  gap: clamp(28px, 3vw, 44px) clamp(10px, 1.4vw, 20px);
  list-style: none;
}
.grid__item--large { grid-column: span 2; grid-row: span 2; }

.card {
  display: grid;
  align-content: start;
  gap: var(--space-3);
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
}
.card:hover .media-frame__poster { scale: 1.025; }
.card:focus-visible { outline-offset: 6px; }

.card__meta {
  display: grid;
  grid-template-columns: 2.4em minmax(0, 1fr);
  gap: 2px var(--space-2);
}
.card__num { color: var(--color-ink-soft); grid-row: span 2; }
.card__title { font-size: 0.98rem; line-height: 1.3; }
.grid__item--large .card__title { font-family: var(--font-display); font-size: var(--step-2); line-height: 1.15; }
.card__brand { color: var(--color-ink-soft); overflow-wrap: anywhere; }

.brands {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 3fr);
  gap: var(--space-3) var(--gutter);
  margin-top: var(--space-7);
  padding-top: var(--space-5);
  border-top: 1px solid var(--color-line);
}
.brands__list { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); list-style: none; }
.brands__list a { text-decoration: none; }
.brands__list a:hover { text-decoration: underline; }

@media (max-width: 560px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid__item--large { grid-row: span 1; }
  .brands { grid-template-columns: 1fr; }
  .filters__status { margin-left: 0; }
}
</style>
  <style>/* assets/css/components/process.css */
/* PROCESSO · etapas curtas, formatos entregues e bloco sobre a Joana */

.process { padding-bottom: var(--space-8); }

.steps {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--space-6) var(--gutter);
  list-style: none;
  counter-reset: step;
}
.step { display: grid; align-content: start; gap: var(--space-3); padding-top: var(--space-4); border-top: 1px solid var(--color-ink); }

  <style>/* assets/css/components/viewer.css */
/* VIEWER · projeto em tela cheia sobre a cor do vídeo, com som controlado pela pessoa */

.viewer {
  width: 100vw;
  max-width: none;
  height: 100dvh;
  max-height: none;
  margin: 0;
  padding: 0;
  border: 0;
  overflow: hidden;
  background: var(--v-bg, var(--color-paper));
  color: var(--v-fg, var(--color-ink));
  --color-ink-soft: var(--v-soft, #57574f);
}
.viewer::backdrop { background: rgb(18 18 17 / 0.5); }

@media (prefers-reduced-motion: no-preference) {
  .viewer[open] { animation: viewer-in var(--dur-2) var(--ease); }
  @keyframes viewer-in { from { opacity: 0; } to { opacity: 1; } }
}

.viewer__inner {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 400px);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "bar bar" "stage panel";
  height: 100%;
}

.viewer__bar {
  grid-area: bar;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-3) var(--gutter);
}
.viewer__close { background: transparent; color: inherit; border: 1px solid currentColor; }
.viewer__close:hover { background: var(--v-fg); color: var(--v-bg); }

.viewer__stage {
  grid-area: stage;
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-rows: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-3) var(--space-4);
  padding: 0 var(--gutter) var(--space-4);
  min-height: 0;
}

.viewer__frame {
  position: relative;
  justify-self: center;
  height: 100%;
  max-height: 100%;
  aspect-ratio: var(--ratio, var(--frame-ratio));
  max-width: 100%;
  overflow: hidden;
  background: rgb(0 0 0 / 0.08);
}
.viewer__poster, .viewer__video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.viewer__video { opacity: 0; transition: opacity var(--dur-2) var(--ease); }
.viewer__frame[data-state="playing"] .viewer__video,
.viewer__frame[data-state="paused"] .viewer__video { opacity: 1; }
.viewer__unavailable {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: var(--space-3);
  background: var(--color-ph-bg);
  color: var(--color-ph-ink);
}

.viewer__nav { background: transparent; color: inherit; border: 1px solid currentColor; }
.viewer__nav:hover { background: var(--v-fg); color: var(--v-bg); }

.viewer__controls {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: var(--space-3);
  width: min(100%, 640px);
  justify-self: center;
}
.viewer__controls[hidden] { display: none; }
.viewer__controls .icon-btn { background: var(--v-fg); color: var(--v-bg); }
.viewer__controls .icon-btn[data-role="sound"][aria-pressed="true"] { background: var(--color-rec); color: #fff; }

.viewer__seek {
  width: 100%;
  height: 28px;
  margin: 0;
  background: transparent;
  accent-color: var(--v-fg);
  cursor: pointer;
}
.viewer__time { min-width: 11ch; text-align: right; }

.viewer__panel {
  grid-area: panel;
  display: grid;
  align-content: start;
  gap: var(--space-5);
  padding: var(--space-4) var(--gutter) var(--space-6) 0;
  overflow-y: auto;
}
.viewer__title {
  font-family: var(--font-display);
  font-size: var(--step-3);
  line-height: var(--leading-tight);
  letter-spacing: -0.02em;
}
.viewer__brand { font-family: var(--font-mono); font-size: var(--step--1); }
.viewer__caption { display: grid; gap: 0.5em; font-size: var(--step-1); line-height: var(--leading-snug); }
.viewer__meta { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: var(--space-2) var(--space-3); border-top: 1px solid currentColor; padding-top: var(--space-4); }
.viewer__meta dt { color: var(--color-ink-soft); }
.viewer__meta dd { overflow-wrap: anywhere; }
.viewer__desc { color: var(--color-ink-soft); font-size: 0.92rem; }
.viewer__panel .btn { justify-self: start; background: var(--v-fg); color: var(--v-bg); border-color: var(--v-fg); }
.viewer__panel .btn:hover { background: transparent; color: var(--v-fg); }
.viewer__keys { color: var(--color-ink-soft); }

@media (max-width: 900px) {
  .viewer { overflow-y: auto; }
  .viewer__inner {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
    grid-template-areas: "bar" "stage" "panel";
    height: auto;
  }
  .viewer__stage { grid-template-columns: minmax(0, 1fr); padding-inline: var(--gutter); }
  .viewer__frame { height: auto; width: min(100%, calc(68dvh * 0.75)); }
  .viewer__nav { display: none; }
  .viewer__panel { padding: var(--space-4) var(--gutter) var(--space-7); overflow: visible; }
  .viewer__keys { display: none; }
}
</style>
